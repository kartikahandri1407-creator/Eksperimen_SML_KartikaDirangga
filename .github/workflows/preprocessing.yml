name: Preprocessing Otomatis

on:
  push:
    branches: [ main ]
    paths:
      - 'heart_raw/**'
      - 'preprocessing/automate_KartikaDirangga.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install dependencies
        run: pip install pandas scikit-learn

      - name: Jalankan preprocessing
        run: python preprocessing/automate_KartikaDirangga.py

      - name: Commit dataset hasil preprocessing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/heart_preprocessing/heart_preprocessing.csv
          git diff --staged --quiet || git commit -m "Update dataset hasil preprocessing (otomatis)"
          git push